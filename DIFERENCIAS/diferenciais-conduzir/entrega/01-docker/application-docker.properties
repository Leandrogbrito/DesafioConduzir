# ============================================================
# PERFIL "docker" - usado SOMENTE quando roda dentro do container
# Onde colocar: src/main/resources/application-docker.properties
# (ao lado do seu application.properties normal)
#
# Este arquivo e ativado pela variavel de ambiente:
#   SPRING_PROFILES_ACTIVE=docker
# que ja esta configurada no docker-compose.yml
# ============================================================

# ----- Banco: PostgreSQL (dentro do Docker) -----
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ----- Desliga o console do H2 em producao -----
spring.h2.console.enabled=false

# ----- Gemini (se for usar o diferencial de IA) -----
gemini.api.key=${GEMINI_API_KEY:}
