# Onde colocar: raiz do conduzir-frontend (mesma pasta do package.json)
# Isso resolve o problema comum de "pagina em branco" ao atualizar
# rotas do React (ex: /concessionarias) dentro do Docker.

server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Encaminha chamadas /api para o backend (evita erro de CORS)
    location /api/ {
        proxy_pass http://backend:8080/;
    }
}
