# ============================================================
# PERFIL DE PRODUCAO (AWS)
# Ative com: SPRING_PROFILES_ACTIVE=prod
# As credenciais vem de VARIAVEIS DE AMBIENTE (nunca no codigo!).
# ============================================================

# ----- Banco de dados: Amazon RDS (PostgreSQL) -----
# Estas variaveis serao preenchidas no Elastic Beanstalk / ECS.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA/Hibernate -----
# "validate" em producao e mais seguro (nao altera tabelas sozinho).
# Use "update" na primeira subida e depois troque para "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ----- Seguranca: desliga o console H2 em producao -----
spring.h2.console.enabled=false

# ----- Porta (Elastic Beanstalk espera a 5000; ECS pode usar 8080) -----
server.port=${SERVER_PORT:8080}

# ----- Actuator: endpoint de health para o Load Balancer checar -----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
