# ===== Nome da aplicacao =====
spring.application.name=gestao-veiculos

# ===== Banco H2 (em memoria, facil para comecar) =====
spring.datasource.url=jdbc:h2:mem:gestaodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
# update = cria/atualiza as tabelas sozinho a partir das @Entity
spring.jpa.hibernate.ddl-auto=update
# mostra o SQL gerado no console (bom para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Console visual do H2 =====
# Acesse em: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Swagger / OpenAPI =====
# Documentacao em: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Actuator (health check para a nuvem) =====
# Disponivel em: http://localhost:8080/actuator/health
management.endpoints.web.exposure.include=health,info

# ===== PostgreSQL (descomente quando trocar do H2) =====
# spring.datasource.url=jdbc:postgresql://localhost:5432/gestaodb
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver
gemini.api.key=${GEMINI_API_KEY:}