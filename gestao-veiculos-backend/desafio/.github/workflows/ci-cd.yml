# ============================================================
# CI/CD com GitHub Actions:
#  - CI  (Integracao Continua): a cada push, roda os TESTES.
#  - CD  (Entrega Continua): na branch main, constroi a imagem
#        Docker, envia para o Amazon ECR e atualiza o ECS.
# ============================================================
name: CI-CD Conduzir Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- ETAPA 1: TESTES (roda sempre) ----------
  testes:
    name: Rodar testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Rodar testes com cobertura
        run: mvn -B clean test

      - name: Publicar relatorio de cobertura (JaCoCo)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ---------- ETAPA 2: DEPLOY (so na main, apos os testes) ----------
  deploy:
    name: Build e Deploy na AWS
    needs: testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login no Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem Docker
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/conduzir-backend:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/conduzir-backend:$IMAGE_TAG $ECR_REGISTRY/conduzir-backend:latest
          docker push $ECR_REGISTRY/conduzir-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/conduzir-backend:latest

      - name: Atualizar servico no ECS
        run: |
          aws ecs update-service \
            --cluster conduzir-cluster \
            --service conduzir-backend-service \
            --force-new-deployment
