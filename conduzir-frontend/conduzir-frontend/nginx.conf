# Local exato: conduzir-frontend/conduzir-frontend/nginx.conf
# (mesma pasta do package.json, ao lado do Dockerfile)

server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Resolve o problema de "pagina em branco" ao atualizar
        # rotas do React dentro do Docker (ex: /concessionarias)
        try_files $uri $uri/ /index.html;
    }

    # Encaminha chamadas /api para o backend (evita erro de CORS)
    location /api/ {
        proxy_pass http://backend:8080/;
    }
}
